
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestiario Mágico</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <main id="contenedor">

        <p class="encabezado">MINISTERIO DE MAGIA</p>

        <h1>BESTIARIO MÁGICO</h1>

        <section id="cartel">

            <h2>SE BUSCA</h2>

            <p class="instruccion">
                PULSA EL BOTÓN PARA MEZCLAR
            </p>

            <div id="bestia">
                <img id="cabeza" src="./assets/cabeza1.png" alt="Cabeza">
                <img id="torzo" src="./assets/torzo2.png" alt="Torso">
                <img id="piernas" src="./assets/piernas3.png" alt="Piernas">
            </div>

            <p id="mensaje">Pulsa el botón para lanzar el hechizo.</p>

            <button id="boton">✦ Lanzar hechizo ✦</button>
        </section>

        <p class="pie">HOGWARTS • ARCHIVOS DEL MUNDO MÁGICO</p>

    </main>

    <script src="script.js"></script>
</body>
</html>
